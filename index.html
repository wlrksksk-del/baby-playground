<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 아기 놀이터">
<title>우리 아기 놀이터</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sunflower:wght@500;700&display=swap">
<style>
/* 글꼴 (SIL OFL 1.1, fonts/OFL.txt): 옆에 fonts/ 폴더가 있으면 그 파일을 쓰고(인터넷 없어도 보임),
   폴더가 없으면 Google Fonts의 같은 글꼴을 쓴다. 이름을 따로 둬야 앞쪽이 실패했을 때 뒤쪽으로 넘어간다. */
@font-face { font-family: 'SunflowerLocal'; src: url('fonts/Sunflower-Medium.ttf') format('truetype'); font-weight: 300 600; font-display: swap; }
@font-face { font-family: 'SunflowerLocal'; src: url('fonts/Sunflower-Bold.ttf') format('truetype'); font-weight: 700 900; font-display: swap; }
/* 레이아웃: 게임 고르기(스크롤 화면) → 게임(고정 무대 화면). 크림 배경 + 말랑한 파스텔 장난감 버튼. 한 가지 밝은 테마로 고정. */
:root {
  --bg: #FFF8EE; --paper: #FFFFFF; --ink: #3F3A52; --ink2: #8C8499; --line: #EFE6D8; --soft: #FBF3E6;
  --yellow: #6E5200; --yellow-bg: #FFE48A; --yellow-bd: #F2BE3C;
  --blue: #1F4E7A;   --blue-bg: #C4E2FF;   --blue-bd: #80B6EC;
  --green: #1D5E31;  --green-bg: #CBF0CE;  --green-bd: #7FCB8C;
  --purple: #6E2A72; --purple-bg: #F7D2F3; --purple-bd: #DB9DD6;
  --violet: #3E3290; --violet-bg: #DCD5FF; --violet-bd: #A99BEA;
  --coral: #8A3424;  --coral-bg: #FFD0C0;  --coral-bd: #F29B83;
  --shadow-amb: 0 14px 28px -10px rgba(90,60,30,.28);
  --shadow-amb-sm: 0 10px 20px -10px rgba(90,60,30,.24);
  --card: 0 1px 0 rgba(255,255,255,.9) inset, 0 2px 0 var(--line), 0 12px 28px -14px rgba(90,60,30,.22);
  --display: 'SunflowerLocal', 'Sunflower', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  --body: 'SunflowerLocal', 'Sunflower', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
html, body { height: 100%; font-weight: 500; background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue-bd); outline-offset: 3px; border-radius: 12px; }
input[type=text] { -webkit-user-select: text; user-select: text; }
#app { position: fixed; inset: 0; }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background:
  radial-gradient(rgba(63,58,82,.07) 1.3px, transparent 1.8px) 0 0 / 22px 22px,
  radial-gradient(circle at 8% 4%, rgba(255,214,110,.35), transparent 30%),
  radial-gradient(circle at 96% 12%, rgba(150,200,255,.30), transparent 32%),
  radial-gradient(circle at 4% 96%, rgba(150,225,165,.28), transparent 32%),
  radial-gradient(circle at 98% 92%, rgba(240,170,230,.26), transparent 32%),
  var(--bg); animation: fadeIn .25s ease both; }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 28px); }
.scroll > .inner { max-width: 560px; margin: 0 auto; }
.stage { flex: 1; position: relative; overflow: hidden; touch-action: none; }

/* 위쪽 바 */
.nav { flex: none; display: flex; align-items: center; height: calc(60px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 10px 0; background: rgba(255,248,238,.82); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 1px 0 var(--line), 0 6px 16px -12px rgba(90,60,30,.3); position: relative; z-index: 20; }
.nav-btn { min-width: 64px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 2px; border-radius: 999px; font-size: 15px; font-weight: 700; color: var(--ink2); }
button.nav-btn { background: var(--paper); padding: 0 14px; box-shadow: 0 2px 0 var(--line), 0 6px 12px -8px rgba(90,60,30,.3); transition: transform .08s, box-shadow .08s; }
button.nav-btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--line); }
.nav-btn .arrow { font-size: 26px; line-height: 1; margin-top: -3px; }
.nav-title { flex: 1; text-align: center; font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 장난감 버튼 */
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: 54px; padding: 14px 16px; border-radius: 18px; font-family: var(--display); font-weight: 700; font-size: 19px; border: 0; background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 55%), var(--bgc); color: var(--fg); box-shadow: inset 0 2px 0 rgba(255,255,255,.7), 0 5px 0 var(--bd), var(--shadow-amb-sm); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(4px); box-shadow: inset 0 2px 0 rgba(255,255,255,.7), 0 1px 0 var(--bd); }
.btn.yellow { --bgc: var(--yellow-bg); --bd: var(--yellow-bd); --fg: var(--yellow); }
.btn.blue   { --bgc: var(--blue-bg);   --bd: var(--blue-bd);   --fg: var(--blue); }
.btn.green  { --bgc: var(--green-bg);  --bd: var(--green-bd);  --fg: var(--green); }
.btn.coral  { --bgc: var(--coral-bg);  --bd: var(--coral-bd);  --fg: var(--coral); }
.row { display: flex; gap: 12px; }
.row > * { flex: 1; min-width: 0; }

/* 홈 */
.home-head { position: relative; text-align: center; padding: calc(env(safe-area-inset-top, 0px) + 30px) 0 22px; }
.home-head > .mascot { box-sizing: content-box; padding: 12px; margin-bottom: 10px; background: var(--paper); border-radius: 50%; box-shadow: 0 0 0 6px rgba(255,228,138,.55), 0 12px 24px -10px rgba(200,150,40,.5); }
.eyebrow { display: table; margin: 0 auto; font-size: 12.5px; font-weight: 700; color: var(--yellow); background: rgba(255,228,138,.6); padding: 4px 12px; border-radius: 999px; letter-spacing: .5px; margin-bottom: 10px !important; }
.home-head h1 { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.25; text-wrap: balance; }
.home-head h1::after { content: ''; display: block; width: 56px; height: 6px; margin: 10px auto 0; border-radius: 999px; background: linear-gradient(90deg, var(--yellow-bd), var(--coral-bd), var(--purple-bd), var(--blue-bd)); }
.home-head .parent { position: absolute; right: 0; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.mascot { display: inline-block; animation: bob 3s ease-in-out infinite; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tile { --bd: var(--line); position: relative; overflow: hidden; isolation: isolate; border-radius: 26px; padding: 18px 10px 16px; min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0) 50%), var(--bgc); color: var(--fg); box-shadow: inset 0 2px 0 rgba(255,255,255,.75), 0 6px 0 var(--bd), var(--shadow-amb); transition: transform .08s, box-shadow .08s; }
.tile::before, .tile::after { content: ''; position: absolute; z-index: -1; border-radius: 50%; background: rgba(255,255,255,.35); pointer-events: none; }
.tile::before { width: 96px; height: 96px; right: -30px; top: -34px; }
.tile::after { width: 40px; height: 40px; left: -12px; bottom: 14px; background: rgba(255,255,255,.22); }
.tile:active { transform: translateY(5px); box-shadow: inset 0 2px 0 rgba(255,255,255,.75), 0 1px 0 var(--bd); }
.tile .em { width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; font-size: 38px; line-height: 1; margin-bottom: 12px; border-radius: 50%; background: rgba(255,255,255,.75); box-shadow: 0 6px 14px -6px rgba(60,40,20,.3); animation: bob 3s ease-in-out infinite; }
.tile:nth-child(2) .em { animation-delay: -.6s; } .tile:nth-child(3) .em { animation-delay: -1.2s; }
.tile:nth-child(4) .em { animation-delay: -1.8s; } .tile:nth-child(5) .em { animation-delay: -2.4s; }
.tile .label { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.2; }
.tile .sub { font-size: 12.5px; font-weight: 600; margin-top: 5px; opacity: .72; }
.tile.wide { grid-column: span 2; flex-direction: row; justify-content: flex-start; gap: 18px; min-height: 124px; padding: 20px 64px 20px 20px; text-align: left; }
.tile.wide .em { width: 84px; height: 84px; font-size: 50px; margin: 0; flex: none; }
.tile.wide .label { font-size: 28px; }
.tile.wide::after { content: '›'; z-index: 0; width: 40px; height: 40px; left: auto; right: 18px; bottom: auto; top: 50%; margin-top: -20px; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; padding-bottom: 3px; color: var(--paper); background: var(--yellow-bd); box-shadow: 0 3px 0 rgba(150,100,0,.25); }
.tile.yellow { --bgc: var(--yellow-bg); --bd: var(--yellow-bd); --fg: var(--yellow); }
.tile.blue   { --bgc: var(--blue-bg);   --bd: var(--blue-bd);   --fg: var(--blue); }
.tile.green  { --bgc: var(--green-bg);  --bd: var(--green-bd);  --fg: var(--green); }
.tile.purple { --bgc: var(--purple-bg); --bd: var(--purple-bd); --fg: var(--purple); }
.tile.violet { --bgc: var(--violet-bg); --bd: var(--violet-bd); --fg: var(--violet); }
.demo-note { margin-top: 22px; background: var(--paper); border-radius: 18px; padding: 14px 16px 14px 50px; position: relative; font-size: 13px; color: var(--ink2); line-height: 1.65; text-align: left; box-shadow: var(--card); }
.demo-note::before { content: '💡'; position: absolute; left: 14px; top: 13px; width: 26px; height: 26px; border-radius: 50%; background: var(--yellow-bg); display: flex; align-items: center; justify-content: center; font-size: 14px; }
.demo-note b { color: var(--ink); }
.foot { text-align: center; font-size: 11.5px; color: #B4AAB8; line-height: 1.8; padding-top: 18px; }

/* 보호자 문: 3초 길게 누르기 */
.hold { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 4px; padding: 9px 14px; border-radius: 999px; background: var(--paper); font-size: 12.5px; font-weight: 700; color: var(--ink2); box-shadow: 0 2px 0 var(--line), 0 6px 12px -8px rgba(90,60,30,.3); touch-action: none; }
.hold::before { content: ''; position: absolute; inset: 0; background: var(--green-bg); transform: scaleX(0); transform-origin: left; }
.hold.pressing::before { transition: transform 3s linear; transform: scaleX(1); }
.hold span { position: relative; }

/* 신뢰 안내 카드 */
.trust-card { background: var(--soft); border-radius: 16px; margin-top: 14px; overflow: hidden; }
.trust-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.trust-row + .trust-row { border-top: 1px dashed var(--line); }
.trust-ic { flex: none; width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 17px; }
.trust-ic.cam { background: var(--blue-bg); }
.trust-ic.safe { background: var(--green-bg); }
.trust-row p { font-size: 13.5px; line-height: 1.5; color: var(--ink); }

/* 보호자 설정 */
.sec { background: var(--paper); border-radius: 22px; padding: 18px; margin-top: 16px; box-shadow: var(--card); }
.sec h2 { font-family: var(--display); font-weight: 700; font-size: 20px; margin-bottom: 6px; }
.sec .hint { font-size: 12.5px; color: var(--ink2); line-height: 1.65; }
.file-btn { position: relative; overflow: hidden; cursor: pointer; }
.file-btn .file-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 100px; }
.fallback { margin-top: 14px; font-size: 13px; color: var(--ink2); }
.fallback summary { cursor: pointer; padding: 6px 0; }
.fallback p { line-height: 1.6; margin: 4px 0 8px; }
.plain-input { font-size: 15px; max-width: 100%; }
.ph-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.ph-row { display: flex; align-items: center; gap: 10px; background: var(--soft); border-radius: 16px; padding: 8px; }
.ph-row img { width: 56px; height: 56px; object-fit: cover; border-radius: 12px; flex: none; box-shadow: 0 0 0 3px var(--paper); }
.ph-row input { flex: 1; min-width: 0; padding: 11px 12px; border: 2px solid transparent; border-radius: 12px; font-size: 16px; font-family: inherit; color: var(--ink); background: var(--paper); outline: none; transition: border-color .15s; }
.ph-row input:focus { border-color: var(--blue-bd); }
.ph-del { width: 40px; height: 40px; border-radius: 50%; font-size: 16px; color: var(--ink2); flex: none; }
.ph-del:active { background: rgba(0,0,0,.06); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { padding: 10px 16px; border-radius: 999px; background: var(--soft); font-size: 15px; font-weight: 600; color: var(--ink2); min-width: 64px; text-align: center; box-shadow: inset 0 0 0 2px var(--line); transition: background .15s, color .15s; }
.chip small { display: block; font-size: 11px; font-weight: 500; opacity: .85; margin-top: 1px; }
.chip.on { background: var(--green-bg); color: var(--green); font-weight: 700; box-shadow: inset 0 0 0 2px var(--green-bd); }
.chip:disabled { opacity: .4; }
.chip.demo { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; }
.chip.demo img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; }
.chip.demo:not(.on) img { filter: grayscale(1); opacity: .5; }

/* 조각 수 고르기 */
.lv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px; }
.lv { --bgc: var(--yellow-bg); --bd: var(--yellow-bd); --fg: var(--yellow); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 10px 16px; border-radius: 26px; background: linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0) 50%), var(--bgc); color: var(--fg); box-shadow: inset 0 2px 0 rgba(255,255,255,.75), 0 6px 0 var(--bd), var(--shadow-amb); transition: transform .08s, box-shadow .08s; }
.lv:active { transform: translateY(5px); box-shadow: inset 0 2px 0 rgba(255,255,255,.75), 0 1px 0 var(--bd); }
.lv:disabled { opacity: .4; }
.lv.green  { --bgc: var(--green-bg);  --bd: var(--green-bd);  --fg: var(--green); }
.lv.yellow { --bgc: var(--yellow-bg); --bd: var(--yellow-bd); --fg: var(--yellow); }
.lv.coral  { --bgc: var(--coral-bg);  --bd: var(--coral-bd);  --fg: var(--coral); }
.lv .tier { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.75); }
.mini { display: grid; gap: 3px; width: 80px; aspect-ratio: 1; padding: 6px; border-radius: 14px; background: rgba(255,255,255,.7); }
.mini i { background: var(--bd); border-radius: 4px; }
.lv b { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1; }
.lv small { font-size: 12px; font-weight: 600; opacity: .7; }
.lead { text-align: center; margin-top: 22px; font-family: var(--display); font-weight: 700; font-size: 24px; color: var(--ink); text-wrap: balance; }

/* 사진 고르기 */
.pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
.pick { border-radius: 24px; overflow: hidden; padding: 8px 8px 0; background: var(--paper); box-shadow: inset 0 2px 0 #fff, 0 5px 0 var(--line), var(--shadow-amb); transition: transform .08s, box-shadow .08s; }
.pick:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
.pick img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; border-radius: 18px; }
.pick div { padding: 10px 6px 12px; font-family: var(--display); font-weight: 700; font-size: 19px; text-align: center; }

/* 직소 퍼즐 */
.jg-board { position: absolute; border-radius: 6px; background: #F4EBDD; box-shadow: 0 0 0 6px var(--paper), 0 0 0 8px var(--line), 0 16px 30px -12px rgba(90,60,30,.35); z-index: 1; }
.jg-board canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.jg-full { opacity: 0; transition: opacity 1s ease; border-radius: 6px; }
.jg-piece { position: absolute; left: 0; top: 0; will-change: transform; transition: opacity .8s ease, filter .3s ease; filter: drop-shadow(0 2px 2px rgba(60,40,20,.18)); }
.jg-piece.lift { filter: drop-shadow(0 10px 12px rgba(60,40,20,.3)); }
.jg-piece.home { transition: transform .16s ease-out, opacity .8s ease, filter .3s ease; filter: none; }
.jg-piece.glow { filter: drop-shadow(0 0 10px rgba(255,214,90,.95)); }

/* 빈자리 퍼즐 */
.pp-bg, .pp-piece { position: absolute; border-radius: 20px; }
.pp-bg { box-shadow: 0 0 0 6px var(--paper), 0 16px 30px -12px rgba(90,60,30,.35); }
.pp-cover { position: absolute; border-radius: 16px; background: rgba(255,248,238,.94); border: 3px dashed var(--yellow-bd); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 44px; color: var(--yellow-bd); z-index: 2; transition: opacity .4s; }
.pp-piece { border-radius: 16px; border: 4px solid #fff; box-shadow: 0 8px 20px rgba(60,40,20,.25); z-index: 5; will-change: transform; }
.pp-piece.placed { box-shadow: 0 0 0 4px var(--green-bd); transition: transform .16s ease-out; }

/* 어디 있을까 */
.ask { margin-top: 18px; text-align: center; background: linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0) 55%), var(--green-bg); color: var(--green); border-radius: 22px; padding: 16px; font-family: var(--display); font-weight: 700; font-size: 26px; box-shadow: inset 0 2px 0 rgba(255,255,255,.75), 0 5px 0 var(--green-bd), var(--shadow-amb-sm); }
.tap-area { position: relative; margin-top: 18px; border-radius: 24px; overflow: hidden; border: 6px solid var(--paper); box-shadow: 0 0 0 2px var(--line), var(--shadow-amb); touch-action: manipulation; }
.tap-area img { width: 100%; aspect-ratio: 1; max-height: 56vh; object-fit: cover; display: block; pointer-events: none; }
.ripple { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: rgba(255,200,50,.5); pointer-events: none; animation: ripple 1s ease-out forwards; }
.mark { position: absolute; font-size: 34px; margin: -20px 0 0 -17px; pointer-events: none; animation: pop .35s ease-out both; }
.dots { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
.dots i { width: 12px; height: 12px; border-radius: 999px; background: var(--line); transition: width .2s; }
.dots i.now { width: 28px; background: var(--blue-bd); } .dots i.done { background: var(--green-bd); }
.found { text-align: center; margin-top: 12px; font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--green); min-height: 30px; }
.tip { margin-top: 14px; text-align: center; font-size: 12.5px; color: var(--ink2); background: var(--paper); border-radius: 14px; padding: 10px 14px; line-height: 1.6; box-shadow: var(--card); }

/* 따라 그리기 */
.tile .em.txt { font-family: var(--display); font-weight: 700; font-size: 36px; color: var(--fg); }
.tr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
@media (min-width: 480px) { .tr-grid { grid-template-columns: repeat(4, 1fr); } }
.tr-item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 6px 10px; border-radius: 22px; background: var(--paper); box-shadow: inset 0 2px 0 #fff, 0 5px 0 var(--line), var(--shadow-amb-sm); transition: transform .08s, box-shadow .08s; }
.tr-item:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
.tr-item svg { width: 72%; aspect-ratio: 1; display: block; color: var(--fg); }
.tr-item span { font-size: 13px; font-weight: 700; color: var(--ink2); }
.tr-item .star { position: absolute; top: 6px; right: 8px; font-size: 15px; font-style: normal; }
.tr-item.yellow { --fg: var(--yellow-bd); } .tr-item.blue { --fg: var(--blue-bd); }
.tr-item.green { --fg: var(--green-bd); } .tr-item.purple { --fg: var(--purple-bd); }
.tr-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 14px); }
.tr-info { display: flex; align-items: center; gap: 12px; }
.tr-name { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.2; }
.tr-word { font-size: 15px; font-weight: 600; color: var(--ink2); margin-top: 2px; }
.tr-say { width: 46px; height: 46px; flex: none; border-radius: 50%; background: var(--paper); font-size: 20px; box-shadow: 0 2px 0 var(--line), 0 6px 12px -8px rgba(90,60,30,.3); }
.tr-say:active { transform: translateY(2px); }
.tr-board { position: relative; flex: none; background: var(--paper); border-radius: 28px; box-shadow: 0 0 0 2px var(--line), var(--shadow-amb); touch-action: none; }
.tr-board canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.tr-head { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: rgba(255,212,94,.45); border: 3px solid #fff; box-shadow: 0 0 0 3px var(--yellow-bd); pointer-events: none; animation: pulse 1.2s ease-in-out infinite; }
.tr-head.nudge { animation: nudge .45s ease, pulse 1.2s ease-in-out .45s infinite; }
.tr-ctrl { display: flex; gap: 10px; width: 100%; max-width: 440px; }
.tr-ctrl .btn { min-height: 50px; padding: 10px 8px; font-size: 17px; }
@media (orientation: landscape) {
  .tr-stage { display: grid; grid-template-columns: auto minmax(0, 300px); grid-template-areas: 'board info' 'board ctrl'; align-content: center; justify-content: center; column-gap: 28px; row-gap: 16px; }
  .tr-board { grid-area: board; } .tr-info { grid-area: info; align-self: end; } .tr-ctrl { grid-area: ctrl; align-self: start; }
}
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.22); } }
@keyframes nudge { 0%, 100% { translate: 0 0; } 25% { translate: -6px 0; } 75% { translate: 6px 0; } }

/* 같이 봐요 */
.album-img { width: 100%; aspect-ratio: 1; max-height: 58vh; object-fit: cover; border-radius: 26px; border: 8px solid var(--paper); box-shadow: 0 0 0 2px var(--line), var(--shadow-amb); display: block; margin-top: 18px; transition: opacity .25s; touch-action: pan-y; }
.album-name { text-align: center; margin-top: 16px; font-family: var(--display); font-weight: 700; font-size: 34px; }
.album-pg { display: table; margin: 4px auto 0; font-size: 12.5px; font-weight: 700; color: var(--ink2); background: var(--paper); padding: 3px 12px; border-radius: 999px; box-shadow: 0 0 0 1.5px var(--line); }

/* 완성 */
.done-bar { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 50; background: var(--paper); border-radius: 28px; padding: 18px 16px 16px; box-shadow: 0 20px 44px -12px rgba(80,60,30,.35), 0 0 0 1px var(--line); animation: up .35s cubic-bezier(.2,.9,.3,1.2) both; overflow: hidden; }
.done-bar::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, var(--yellow-bd), var(--coral-bd), var(--purple-bd), var(--blue-bd), var(--green-bd)); }
.done-title { display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 30px; margin-bottom: 14px; }
@media (orientation: landscape) and (min-width: 640px) { .done-bar { left: auto; width: 36%; min-width: 300px; } }

.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 900; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 950; animation: toastUp .25s ease both; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 12px 24px -10px rgba(40,30,60,.5); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-4deg); } }
@keyframes ripple { 0% { transform: scale(0); opacity: .9; } 100% { transform: scale(3); opacity: 0; } }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastUp { from { transform: translate(-50%, 16px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  'use strict';

  // ================================================================ 기본 도구
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'cls') e.className = v;
      else if (k === 'css') Object.assign(e.style, v);
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) {
      if (c == null || c === false) continue;
      e.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return e;
  }
  const shuffle = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const dpr = () => Math.min(window.devicePixelRatio || 1, 2);

  // 귀여운 퍼즐 조각 캐릭터 (이모지 대신 — 기종마다 다르게 보이지 않도록 직접 그린 SVG)
  const MASCOT_SVG = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M24 24h14c0-9 10-9 10 0h14c3 0 5 2 5 5v14c9 0 9 10 0 10v14c0 3-2 5-5 5H48c0 9-10 9-10 0H24c-3 0-5-2-5-5V53c-9 0-9-10 0-10V29c0-3 2-5 5-5z" fill="#FFD45E" stroke="#C8A838" stroke-width="3" stroke-linejoin="round"/><circle cx="40" cy="46" r="4.5" fill="#4a3728"/><circle cx="60" cy="46" r="4.5" fill="#4a3728"/><ellipse cx="35" cy="58" rx="5" ry="3" fill="#ff8a7a" opacity=".55"/><ellipse cx="65" cy="58" rx="5" ry="3" fill="#ff8a7a" opacity=".55"/><path d="M38 60q12 10 24 0" stroke="#4a3728" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>';
  function icon(svg, size = 44) {
    const s = h('span', { cls: 'mascot', css: { display: 'inline-block', width: size + 'px', height: size + 'px', lineHeight: 0 } });
    s.innerHTML = svg;
    return s;
  }

  function toast(msg) {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const t = h('div', { cls: 'toast', 'role': 'status', 'aria-live': 'polite' }, msg);
    document.body.append(t);
    setTimeout(() => t.remove(), 2600);
  }

  // ================================================================ 설정 (사진은 저장하지 않음)
  const GRIDS = { 4: [2, 2], 6: [2, 3], 9: [3, 3], 16: [4, 4], 24: [4, 6], 40: [5, 8], 60: [6, 10] };
  const LEVELS = Object.keys(GRIDS).map(Number);
  const AGE = { 4: '30개월~', 6: '30개월~', 9: '3세~', 16: '3~4세', 24: '4세~', 40: '4~5세', 60: '5세~' };
  const TIER = { 4: 'green', 6: 'green', 9: 'yellow', 16: 'yellow', 24: 'coral', 40: 'coral', 60: 'coral' };
  const TIER_LABEL = { green: '쉬워요', yellow: '재미있어요', coral: '집중 도전!' };
  const NAV_H = 56, MIN_PIECE = 44;
  const JITTER = 0.35; // 흩어 놓을 때 조각 몸통 대비 추가로 흔드는 비율 (클수록 더 어지럽게, 대신 더 겹친다)
  const snapRatio = (n) => (n <= 6 ? 0.6 : n <= 16 ? 0.45 : 0.35);

  const S = { screen: 'home', photos: [], demo: [], levels: [...LEVELS], ghost: true, sound: true, fx: true, hiddenDemos: [], traced: new Set() };
  try {
    const saved = JSON.parse(localStorage.getItem('ugj-settings-v2') || 'null');
    if (saved) for (const k of ['levels', 'ghost', 'sound', 'fx', 'hiddenDemos']) if (k in saved) S[k] = saved[k];
  } catch (_) {}
  function saveSettings() {
    try { localStorage.setItem('ugj-settings-v2', JSON.stringify({ levels: S.levels, ghost: S.ghost, sound: S.sound, fx: S.fx, hiddenDemos: S.hiddenDemos })); } catch (_) {}
  }
  // 가족 사진이 있으면 그것만, 없으면 보호자가 끄지 않은 예시 그림만 쓴다
  const photos = () => (S.photos.length ? S.photos : S.demo.filter((d) => !S.hiddenDemos.includes(d.id)));
  const nameOf = (p, i) => p.name || `사진 ${i + 1}`;

  // ================================================================ 소리 (마림바/실로폰 느낌의 말렛 타건음)
  // 몸통(사인파, 긴 감쇠)과 말렛이 때리는 순간의 비조화 배음(매우 짧은 감쇠)을 겹쳐 나무 타건 질감을 합성한다.
  let ac = null;
  function ctx() {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function mallet(freq, { dur = 0.35, vol = 0.09, delay = 0, strike = 0.5 } = {}) {
    if (!S.sound) return;
    try {
      const a = ctx(), t = a.currentTime + delay;
      const out = a.createGain(); out.gain.value = vol; out.connect(a.destination);
      const body = a.createOscillator(), bg = a.createGain();
      body.type = 'sine'; body.frequency.value = freq;
      bg.gain.setValueAtTime(0, t); bg.gain.linearRampToValueAtTime(1, t + 0.004);
      bg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      body.connect(bg).connect(out); body.start(t); body.stop(t + dur + 0.05);
      if (strike > 0) {
        const hit = a.createOscillator(), hg = a.createGain();
        hit.type = 'sine'; hit.frequency.value = freq * 3.93; // 말렛 타격 순간의 배음비 (실제 마림바 측정값에 근접)
        hg.gain.setValueAtTime(0, t); hg.gain.linearRampToValueAtTime(strike, t + 0.002);
        hg.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
        hit.connect(hg).connect(out); hit.start(t); hit.stop(t + 0.09);
      }
    } catch (_) {}
  }
  const sndTap = () => mallet(880, { dur: 0.1, vol: 0.05, strike: 0.4 });
  const sndSnap = () => { mallet(660, { dur: 0.3, vol: 0.08 }); mallet(990, { dur: 0.24, vol: 0.05, delay: 0.05, strike: 0.3 }); };
  const sndDone = () => { [523, 659, 784, 1046].forEach((f, i) => mallet(f, { dur: 0.55, vol: 0.07, delay: i * 0.12 })); };
  const sndPop = (d) => mallet(700 + Math.random() * 400, { dur: 0.22, vol: 0.045, delay: d, strike: 0.4 });

  // ================================================================ 예시 그림 (보호자가 사진을 넣기 전)
  function demoPhoto(name, draw) {
    const c = document.createElement('canvas'); c.width = c.height = 900;
    draw(c.getContext('2d'));
    const url = c.toDataURL('image/jpeg', 0.88), img = new Image();
    img.src = url;
    return { id: 'demo-' + name, name, url, img, demo: true };
  }
  function face(g, cx, cy, r, skin, extra) {
    g.fillStyle = skin; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    g.fillStyle = '#3b2a20';
    [-1, 1].forEach((s) => { g.beginPath(); g.ellipse(cx + s * r * 0.36, cy - r * 0.12, r * 0.08, r * 0.11, 0, 0, 7); g.fill(); });
    g.fillStyle = '#fff';
    [-1, 1].forEach((s) => { g.beginPath(); g.arc(cx + s * r * 0.36 + r * 0.03, cy - r * 0.16, r * 0.03, 0, 7); g.fill(); });
    g.fillStyle = 'rgba(255,120,120,.35)';
    [-1, 1].forEach((s) => { g.beginPath(); g.ellipse(cx + s * r * 0.55, cy + r * 0.18, r * 0.13, r * 0.08, 0, 0, 7); g.fill(); });
    if (extra) extra();
    g.strokeStyle = '#7a3b2a'; g.lineWidth = r * 0.06; g.lineCap = 'round';
    g.beginPath(); g.arc(cx, cy + r * 0.22, r * 0.25, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
  }
  function makeDemos() {
    S.demo = [
      demoPhoto('해님', (g) => {
        const sky = g.createLinearGradient(0, 0, 0, 900); sky.addColorStop(0, '#9fd3f2'); sky.addColorStop(1, '#e6f5ff');
        g.fillStyle = sky; g.fillRect(0, 0, 900, 900);
        g.fillStyle = '#ffcf4d';
        for (let i = 0; i < 12; i++) { g.save(); g.translate(450, 450); g.rotate((i / 12) * Math.PI * 2); g.beginPath(); g.moveTo(-40, -300); g.lineTo(0, -400); g.lineTo(40, -300); g.fill(); g.restore(); }
        face(g, 450, 450, 280, '#ffd85e', () => { g.fillStyle = '#f0a830'; g.beginPath(); g.ellipse(450, 470, 26, 34, 0, 0, 7); g.fill(); });
      }),
      demoPhoto('곰돌이', (g) => {
        g.fillStyle = '#c9e7c4'; g.fillRect(0, 0, 900, 900);
        g.fillStyle = '#a9d6a2'; for (let i = 0; i < 9; i++) { g.beginPath(); g.arc((i * 137) % 900, 820 + (i % 3) * 30, 120, 0, 7); g.fill(); }
        g.fillStyle = '#9b6b45'; [-1, 1].forEach((s) => { g.beginPath(); g.arc(450 + s * 220, 220, 100, 0, 7); g.fill(); });
        g.fillStyle = '#e8b98f'; [-1, 1].forEach((s) => { g.beginPath(); g.arc(450 + s * 220, 220, 55, 0, 7); g.fill(); });
        face(g, 450, 470, 290, '#9b6b45', () => {
          g.fillStyle = '#e8c49e'; g.beginPath(); g.ellipse(450, 560, 120, 95, 0, 0, 7); g.fill();
          g.fillStyle = '#3b2a20'; g.beginPath(); g.ellipse(450, 500, 42, 30, 0, 0, 7); g.fill();
        });
      }),
      demoPhoto('우리집', (g) => {
        const sky = g.createLinearGradient(0, 0, 0, 600); sky.addColorStop(0, '#bcd9e8'); sky.addColorStop(1, '#eef6f3');
        g.fillStyle = sky; g.fillRect(0, 0, 900, 900);
        g.fillStyle = '#f2d48a'; g.beginPath(); g.arc(720, 170, 85, 0, 7); g.fill();
        g.fillStyle = '#a9c9a0'; g.beginPath(); g.ellipse(250, 880, 700, 300, 0, 0, 7); g.fill();
        g.fillStyle = '#93bb8b'; g.beginPath(); g.ellipse(800, 920, 520, 300, 0, 0, 7); g.fill();
        g.fillStyle = '#e9b8a4'; g.fillRect(230, 420, 300, 250);
        g.fillStyle = '#c97f6b'; g.beginPath(); g.moveTo(195, 440); g.lineTo(380, 270); g.lineTo(565, 440); g.fill();
        g.fillStyle = '#8c6a55'; g.fillRect(345, 530, 75, 140);
        g.fillStyle = '#fbf3df'; g.fillRect(260, 470, 66, 58); g.fillRect(440, 470, 66, 58);
        g.fillStyle = '#7a5a45'; g.fillRect(665, 450, 40, 220);
        g.fillStyle = '#7fae84'; g.beginPath(); g.arc(685, 420, 115, 0, 7); g.fill();
        g.fillStyle = '#fff'; [[150, 160], [215, 145], [270, 170]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 50, 0, 7); g.fill(); });
      }),
    ];
  }

  async function ready(ph) { try { await ph.img.decode(); } catch (_) {} return ph.img.naturalWidth > 0; }

  // ================================================================ 폭죽
  const fxCanvas = h('canvas', { cls: 'fx' });
  document.body.append(fxCanvas);
  let fxRun = 0;
  function palette(src) {
    const out = ['#FFD45E', '#FF8FA3', '#7CC8FF', '#8EE08E', '#C9A0FF'];
    try {
      const c = document.createElement('canvas'); c.width = c.height = 3;
      const g = c.getContext('2d'); g.drawImage(src, 0, 0, 3, 3);
      const d = g.getImageData(0, 0, 3, 3).data;
      for (let i = 0; i < d.length; i += 8) out.push(`rgb(${d[i]},${d[i + 1]},${d[i + 2]})`);
    } catch (_) {}
    return out;
  }
  function fireworks(rect, src) {
    if (!S.fx) return;
    const run = ++fxRun, W = innerWidth, H = innerHeight, r = dpr();
    fxCanvas.width = W * r; fxCanvas.height = H * r;
    const g = fxCanvas.getContext('2d'); g.setTransform(r, 0, 0, r, 0, 0);
    const colors = palette(src);
    const m = Math.min(W, H) * 0.16;
    const spots = shuffle([
      [rect.left + rect.width * 0.1, rect.top + rect.height * 0.12], [rect.right - rect.width * 0.1, rect.top + rect.height * 0.2],
      [rect.left + rect.width * 0.2, rect.bottom - rect.height * 0.12], [rect.right - rect.width * 0.15, rect.bottom - rect.height * 0.2],
      [rect.left + rect.width * 0.5, rect.top + rect.height * 0.05],
    ]).slice(0, 4).map(([x, y]) => [Math.min(W - 20, Math.max(20, x)), Math.min(H - 20, Math.max(20, y))]);
    const parts = [];
    spots.forEach(([x, y], i) => {
      const t0 = i * 230; sndPop(t0 / 1000);
      for (let k = 0; k < 34; k++) {
        const a = (k / 34) * Math.PI * 2 + Math.random() * 0.2, v = m * (0.7 + Math.random() * 0.6);
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t0, c: colors[Math.floor(Math.random() * colors.length)], r: 2.5 + Math.random() * 3, star: k % 6 === 0 });
      }
    });
    const start = performance.now(), LIFE = 1100;
    (function frame(now) {
      if (run !== fxRun) return;
      const el = now - start; let alive = false;
      g.clearRect(0, 0, W, H);
      for (const p of parts) {
        const t = (el - p.t0) / LIFE;
        if (t < 0) { alive = true; continue; }
        if (t > 1) continue;
        alive = true;
        const e = 1 - Math.pow(1 - t, 3), px = p.x + p.vx * e, py = p.y + p.vy * e + 50 * t * t, rr = p.r * (1 - t * 0.3);
        g.globalAlpha = 1 - t * t; g.fillStyle = p.c;
        if (p.star) { g.font = `${rr * 5}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('★', px, py); }
        else { g.beginPath(); g.arc(px, py, rr, 0, 7); g.fill(); }
      }
      g.globalAlpha = 1;
      if (alive) requestAnimationFrame(frame); else g.clearRect(0, 0, W, H);
    })(start);
  }
  function stopFx() { fxRun++; fxCanvas.getContext('2d').clearRect(0, 0, fxCanvas.width, fxCanvas.height); }

  // ================================================================ 화면 전환
  const SCREENS = {};
  let current = null; // 지금 게임의 { relayout }
  function go(screen, patch = {}) {
    current = null; stopFx();
    Object.assign(S, patch, { screen });
    const app = document.getElementById('app');
    app.innerHTML = '';
    const view = SCREENS[screen]();
    app.append(view.el || view);
    if (view.mount) current = view.mount() || null;
  }

  function nav(title, onBack, home = true) {
    return h('div', { cls: 'nav' },
      onBack ? h('button', { cls: 'nav-btn', onclick: () => { sndTap(); onBack(); }, 'aria-label': '뒤로' }, h('span', { cls: 'arrow' }, '‹'), '뒤로') : h('span', { cls: 'nav-btn' }),
      h('div', { cls: 'nav-title' }, title),
      home ? h('button', { cls: 'nav-btn', onclick: () => { sndTap(); go('home'); }, 'aria-label': '처음으로' }, h('span', { css: { fontSize: '22px' } }, '🏠')) : h('span', { cls: 'nav-btn' }));
  }

  function trustCard() {
    return h('div', { cls: 'trust-card' },
      h('div', { cls: 'trust-row' },
        h('div', { cls: 'trust-ic cam' }, '📷'),
        h('p', {}, '내 폰에 있는 가족 사진으로 바로 퍼즐을 만들 수 있어요')),
      h('div', { cls: 'trust-row' },
        h('div', { cls: 'trust-ic safe' }, '✅'),
        h('p', {}, '소중한 가족 사진은 인터넷에 올리지 않고 내 폰에만 안전하게 보관돼요')));
  }

  function holdButton(label, onDone) {
    const b = h('button', { cls: 'hold', 'aria-label': label + ' (3초 길게 누르기)' }, h('span', {}, '🔒 ' + label));
    let t = null, fired = false;
    const cancel = () => { clearTimeout(t); t = null; b.classList.remove('pressing'); };
    b.addEventListener('pointerdown', (e) => {
      e.stopPropagation(); fired = false;
      try { b.setPointerCapture(e.pointerId); } catch (_) {}
      b.classList.add('pressing');
      t = setTimeout(() => { fired = true; cancel(); onDone(); }, 3000);
    });
    b.addEventListener('pointerup', () => { if (t && !fired) toast('보호자 메뉴는 3초 동안 꾹 눌러주세요'); cancel(); });
    b.addEventListener('pointercancel', cancel);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
    return b;
  }

  function showDone(screenEl, { rect, src, title = '잘했어요!', again }) {
    sndDone();
    if (rect) fireworks(rect, src);
    setTimeout(() => {
      if (!screenEl.isConnected) return;
      screenEl.append(h('div', { cls: 'done-bar' },
        h('div', { cls: 'done-title' }, icon(MASCOT_SVG, 36), title),
        h('div', { cls: 'row' },
          h('button', { cls: 'btn yellow', onclick: () => { sndTap(); again.go(); } }, again.label),
          h('button', { cls: 'btn blue', onclick: () => { sndTap(); go('home'); } }, '🏠 처음으로'))));
    }, 1400);
  }

  function fitSide(rows, cols, W, H) {
    const p = H >= W;

    const [a, b] = GRIDS[n], sh = Math.min(innerWidth, innerHeight), lg = Math.max(innerWidth, innerHeight);
    return Math.min(fitSide(b, a, sh, lg - NAV_H), fitSide(a, b, lg, sh - NAV_H));

  // ================================================================ 직소 퍼즐
  // 한 변을 (x0,y0)→(x1,y1)로 그린다. sign: 0=평평, 1=볼록, -1=오목. 좌우 대칭이라 이웃 조각과 정확히 맞물린다.
  function edge(p, x0, y0, x1, y1, sign) {
    if (!sign) { p.lineTo(x1, y1); return; }
    const dx = x1 - x0, dy = y1 - y0;
    const P = (t, k) => [x0 + dx * t + dy * k * sign, y0 + dy * t - dx * k * sign];
    p.lineTo(...P(0.35, 0));
    p.bezierCurveTo(...P(0.40, 0.00), ...P(0.42, 0.05), ...P(0.40, 0.10));
    p.bezierCurveTo(...P(0.36, 0.16), ...P(0.37, 0.25), ...P(0.50, 0.25));
    p.bezierCurveTo(...P(0.63, 0.25), ...P(0.64, 0.16), ...P(0.60, 0.10));
    p.bezierCurveTo(...P(0.58, 0.05), ...P(0.60, 0.00), ...P(0.65, 0.00));
    p.lineTo(x1, y1);
  }
  function piecePath(x, y, s, e) {
    const p = new Path2D();
    p.moveTo(x, y);
    edge(p, x, y, x + s, y, e.top); edge(p, x + s, y, x + s, y + s, e.right);
    edge(p, x + s, y + s, x, y + s, e.bottom); edge(p, x, y + s, x, y, e.left);
    p.closePath();
    return p;
  }

  SCREENS.jigsaw = () => {
    const n = S.pieces, img = S.photo.img;
    const stage = h('div', { cls: 'stage' });
    const el = h('div', { cls: 'screen' }, nav(`${n}조각 퍼즐`, () => go('pick', { target: 'jigsaw' })), stage);

    function mount() {
      const R0 = stage.getBoundingClientRect(), portrait0 = R0.height >= R0.width;
      const [a, b] = GRIDS[n], rows = portrait0 ? b : a, cols = portrait0 ? a : b;
      const rnd = () => (Math.random() < 0.5 ? 1 : -1);
      const hE = [...Array(rows - 1)].map(() => [...Array(cols)].map(rnd));
      const vE = [...Array(rows)].map(() => [...Array(cols - 1)].map(rnd));
      const pieces = [];
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) pieces.push({
        r, c, placed: false, z: 0, x: 0, y: 0,
        e: { top: r ? -hE[r - 1][c] : 0, bottom: r < rows - 1 ? hE[r][c] : 0, left: c ? -vE[r][c - 1] : 0, right: c < cols - 1 ? vE[r][c] : 0 },
      });
      const ghost = h('canvas'), full = h('canvas', { cls: 'jg-full' }), board = h('div', { cls: 'jg-board' }, ghost, full);
      stage.append(board);
      const hit = document.createElement('canvas').getContext('2d');
      let g = null, zTop = 10, done = false, drag = null;

      const place = (p) => { p.el.style.transform = `translate3d(${p.x}px,${p.y}px,0)`; p.el.style.zIndex = p.placed ? 2 : p.z; };
      const clampP = (p, size) => {
        const m = g.pad;
        p.x = Math.min(Math.max(p.x, -m), g.W - size + m);
        p.y = Math.min(Math.max(p.y, -m), g.H - size + m);
      };
      function scatter(list, size) { // 남은 조각을 빈 곳 전체에 고르게 펼친다
        const A = g.area, k = list.length; if (!k) return;
        // 칸 크기는 눈에 보이는 조각 몸통(g.s) 기준으로 잡는다. 이음새 여백(pad)까지 포함한 size로 잡으면
        // 폰 세로 화면에서 1열만 허용되어 조각이 한 줄로 쏠린다. 볼록 이음새끼리 살짝 겹치는 것은 괜찮다.
        // 가로·세로 칸 수 조합 중 한 칸이 가장 넓어지는(= 조각끼리 가장 덜 겹치는) 조합을 고른다.
        let cc = 1, rr = k, best = -1;
        for (let c = 1; c <= k; c++) {
          const r = Math.ceil(k / c), cell = Math.min(A.w / c, A.h / r);
          if (cell > best + 0.5) { best = cell; cc = c; rr = r; }
        }
        const cw = A.w / cc, ch = A.h / rr, core = g.s;
        const slots = shuffle([...Array(rr * cc).keys()]).slice(0, k);
        list.forEach((p, i) => {
          const sr = Math.floor(slots[i] / cc), sc = slots[i] % cc;
          // 칸 가운데에 몸통을 두고 흔든다. 남는 공간이 없어도 몸통의 일부만큼은 흔들어 바둑판처럼 반듯해 보이지 않게 한다.
          const jx = Math.max(0, cw - core) * 0.8 + core * JITTER, jy = Math.max(0, ch - core) * 0.8 + core * JITTER;
          p.x = A.x + sc * cw + cw / 2 - size / 2 + (Math.random() - 0.5) * jx;
          p.y = A.y + sr * ch + ch / 2 - size / 2 + (Math.random() - 0.5) * jy;
          clampP(p, size); place(p);
        });
      }
      function layout(fresh) {
        const W = stage.clientWidth, H = stage.clientHeight, p = H >= W;
        const s = fitSide(rows, cols, W, H), bw = s * cols, bh = s * rows;
        const bx = p ? (W - bw) / 2 : (W * 0.53 - bw) / 2, by = p ? 14 : (H - bh) / 2;
        const pad = Math.ceil(s * 0.28), r = dpr();
        const area = p ? { x: 0, y: by + bh + 10, w: W, h: H - (by + bh + 10) } : { x: W * 0.53, y: 0, w: W * 0.47, h: H };
        g = { s, bw, bh, bx, by, pad, area, W, H };
        // 사진을 판 비율에 맞춰 가운데 자르기
        const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
        const k = Math.max(bw / sw, bh / sh), cw = bw / k, chh = bh / k;
        const fc = document.createElement('canvas'); fc.width = Math.round(bw * r); fc.height = Math.round(bh * r);
        fc.getContext('2d').drawImage(img, (sw - cw) / 2, (sh - chh) / 2, cw, chh, 0, 0, fc.width, fc.height);
        g.fc = fc;
        Object.assign(board.style, { left: bx + 'px', top: by + 'px', width: bw + 'px', height: bh + 'px' });
        ghost.width = full.width = fc.width; ghost.height = full.height = fc.height;
        const gx = ghost.getContext('2d'); gx.setTransform(r, 0, 0, r, 0, 0);
        if (S.ghost) { gx.globalAlpha = 0.25; gx.drawImage(fc, 0, 0, bw, bh); gx.globalAlpha = 1; }

        pieces.forEach((q) => gx.stroke(piecePath(q.c * s, q.r * s, s, q.e)));
        full.getContext('2d').drawImage(fc, 0, 0);
        const size = s + pad * 2;
        pieces.forEach((q) => {
          q.path = piecePath(pad, pad, s, q.e);
          if (!q.el) { q.el = h('canvas', { cls: 'jg-piece' }); stage.append(q.el); }
          q.el.width = q.el.height = Math.round(size * r);
          q.el.style.width = q.el.style.height = size + 'px';
          const x = q.el.getContext('2d'); x.setTransform(r, 0, 0, r, 0, 0);
          x.save(); x.clip(q.path);

  };

  SCREENS.trace = () => {
    const cat = traceCat(), n = cat.items.length, i = Math.min(S.traceIdx || 0, n - 1), it = cat.items[i];
    const strokes = it._pts || (it._pts = it.d.map(samplePath));
    const goItem = (j) => go('trace', { traceIdx: (j + n) % n });
    const canvas = h('canvas'), head = h('div', { cls: 'tr-head' });
    const board = h('div', { cls: 'tr-board' }, canvas, head);
    const info = h('div', { cls: 'tr-info' },
      h('div', {}, h('div', { cls: 'tr-name' }, traceTitle(cat, it)), it.word && h('div', { cls: 'tr-word' }, it.word)),
      h('button', { cls: 'tr-say', 'aria-label': '소리 듣기', onclick: () => speak(it.say, cat.lang) }, '🔊'));
    const ctrl = h('div', { cls: 'tr-ctrl' },
      h('button', { cls: 'btn blue', onclick: () => { sndTap(); goItem(i - 1); } }, '◀ 이전'),
      h('button', { cls: 'btn yellow', onclick: () => { sndTap(); goItem(i); } }, '↺ 다시'),
      h('button', { cls: 'btn green', onclick: () => { sndTap(); goItem(i + 1); } }, '다음 ▶'));
    const stage = h('div', { cls: 'stage tr-stage' }, info, board, ctrl);
    const el = h('div', { cls: 'screen' }, nav(cat.label.replace(' 따라쓰기', ''), () => go('traceList')), stage);

    function mount() {
      let si = 0, idx = 0, dragId = null, last = null, done = false, k = 1, raf = 0;
      const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

      function layout() {
        const W = stage.clientWidth, H = stage.clientHeight;
        let side = W > H ? Math.min(H - 32, W - 360) : Math.min(W - 32, H - info.offsetHeight - ctrl.offsetHeight - 64);
        side = Math.max(160, Math.min(560, Math.floor(side)));
        board.style.width = board.style.height = side + 'px';
        const r = dpr(); canvas.width = canvas.height = Math.round(side * r); k = side / 100;
        draw();
      }
      const poly = (g, pts, end) => { g.beginPath(); g.moveTo(...pts[0]); for (let j = 1; j <= end; j++) g.lineTo(...pts[j]); };
      function draw() {
        raf = 0;
        const g = canvas.getContext('2d'), r = dpr();
        g.setTransform(r * k, 0, 0, r * k, 0, 0); g.clearRect(0, 0, 100, 100);
        // 깍두기 공책처럼 가운데 십자 안내선
        g.save(); g.strokeStyle = '#F4D3CC'; g.lineWidth = 0.5; g.setLineDash([2, 2]);
        g.beginPath(); g.moveTo(50, 4); g.lineTo(50, 96); g.moveTo(4, 50); g.lineTo(96, 50); g.stroke(); g.restore();
        g.lineCap = 'round'; g.lineJoin = 'round';
        // 1) 연한 길
        strokes.forEach((pts, s) => { g.strokeStyle = s === si && !done ? '#EFE6D8' : '#F6F1E9'; g.lineWidth = TRACE_BAND; poly(g, pts, pts.length - 1); g.stroke(); });
        // 2) 아직 안 그린 획의 점선(대시) 안내
        strokes.forEach((pts, s) => {
          if (s < si) return;
          g.save(); g.setLineDash([2.4, 2.6]); g.lineWidth = s === si ? 1.3 : 0.9; g.strokeStyle = s === si ? '#9C92AB' : '#D2CADB';
          poly(g, pts, pts.length - 1); g.stroke(); g.restore();
        });
        // 3) 아이가 칠한 부분
        strokes.forEach((pts, s) => {
          const end = s < si ? pts.length - 1 : s === si ? idx : 0;
          if (end < 1) return;
          g.strokeStyle = TRACE_COLORS[s % TRACE_COLORS.length]; g.lineWidth = TRACE_INK; poly(g, pts, end); g.stroke();
        });
        if (done) { head.style.display = 'none'; return; }
        // 4) 획 시작점 번호 (현재 획이 맨 위에 오도록 뒤에서부터)
        for (let s = strokes.length - 1; s >= si; s--) {
          if (s === si && idx > 0) continue;
          const [x, y] = strokes[s][0];
          g.fillStyle = s === si ? '#5BBF72' : '#D5CDE0'; g.beginPath(); g.arc(x, y, 5.2, 0, 7); g.fill();
          g.strokeStyle = '#fff'; g.lineWidth = 1.2; g.stroke();
          if (strokes.length > 1) { g.fillStyle = '#fff'; g.font = 'bold 6px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(s + 1), x, y + 0.4); }
        }
        // 5) 가야 할 방향 화살표
        const pts = strokes[si], a = Math.min(pts.length - 2, idx + 10), b = Math.min(pts.length - 1, a + 3);
        if (b > a) {
          g.save(); g.translate(...pts[a]); g.rotate(Math.atan2(pts[b][1] - pts[a][1], pts[b][0] - pts[a][0]));
          g.strokeStyle = '#5BBF72'; g.lineWidth = 1.8; g.beginPath(); g.moveTo(-2.4, -3); g.lineTo(1.6, 0); g.lineTo(-2.4, 3); g.stroke(); g.restore();
        }
        head.style.display = ''; head.style.left = pts[idx][0] * k + 'px'; head.style.top = pts[idx][1] * k + 'px';
      }
      const redraw = () => { if (!raf) raf = requestAnimationFrame(draw); };
      const pt = (e) => { const R = board.getBoundingClientRect(); return [(e.clientX - R.left) / k, (e.clientY - R.top) / k]; };

      function advance(p) {
        const pts = strokes[si];
        let best = idx;
        for (let j = idx + 1; j <= Math.min(idx + TRACE_LOOK, pts.length - 1); j++) if (dist(p, pts[j]) < TRACE_TOL) best = j;
        if (best > idx) {
          if (Math.floor(best / TRACE_TICK) > Math.floor(idx / TRACE_TICK)) mallet(1046 + (best % 3) * 130, { dur: 0.08, vol: 0.03, strike: 0.2 });
          idx = best;
        }
        if (idx >= pts.length - 1 - TRACE_END) endStroke();
      }
      function endStroke() {
        si++; idx = 0; dragId = null; sndSnap();
        if (si >= strokes.length) { done = true; finish(); }
      }
      function finish() {
        draw();
        S.traced.add(cat.id + i);
        setTimeout(() => speak(it.word ? `${it.say}. ${spokenWord(it)}` : it.say, cat.lang), 700);
        showDone(el, { rect: board.getBoundingClientRect(), src: canvas, title: cat.id === 'line' ? '잘 그렸어요! 🎉' : '참 잘 썼어요! 🎉',
          again: { label: cat.id === 'line' ? '▶ 다음 선' : '▶ 다음 글자', go: () => goItem(i + 1) } });
      }

      board.addEventListener('pointerdown', (e) => {
        if (done || dragId !== null) return;
        const p = pt(e);
        if (dist(p, strokes[si][idx]) > TRACE_TOL * 1.6) { // 엉뚱한 곳: 어디서 시작하는지 살짝 흔들어 알려준다
          head.classList.remove('nudge'); void head.offsetWidth; head.classList.add('nudge');
          return;
        }
        dragId = e.pointerId; last = p;
        try { board.setPointerCapture(e.pointerId); } catch (_) {}
      });
      board.addEventListener('pointermove', (e) => {
        if (e.pointerId !== dragId) return;
        const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
        for (const ev of evs.length ? evs : [e]) {
          const q = pt(ev), steps = Math.max(1, Math.ceil(dist(last, q)));
          // 빠르게 그어도 중간 점을 빠뜨리지 않도록 이전 위치와 사이를 1단위씩 메운다
          for (let s = 1; s <= steps && dragId !== null; s++) advance([last[0] + ((q[0] - last[0]) * s) / steps, last[1] + ((q[1] - last[1]) * s) / steps]);
          last = q;
          if (dragId === null) break;
        }
        redraw();
      });
      const up = (e) => { if (e.pointerId === dragId) dragId = null; };
      board.addEventListener('pointerup', up);
      board.addEventListener('pointercancel', up);

      layout();
      speak(it.say, cat.lang);
      return { relayout: layout };
    }
    return { el, mount };
  };

  // ================================================================ 같이 봐요
  SCREENS.album = () => {
    const list = photos();
    let i = Math.min(S.albumIdx || 0, list.length - 1);
    const img = h('img', { cls: 'album-img', src: list[i].url, alt: '' });
    const name = h('div', { cls: 'album-name' }, nameOf(list[i], i));
    const pg = h('div', { cls: 'album-pg' }, `${i + 1} / ${list.length}`);
    function show(d) {
      const j = i + d; if (j < 0 || j >= list.length) return;
      i = j; S.albumIdx = i; sndTap();
      img.style.opacity = 0;
      setTimeout(() => { img.src = list[i].url; img.style.opacity = 1; }, 200);
      name.textContent = nameOf(list[i], i); pg.textContent = `${i + 1} / ${list.length}`;
    }
    let sx = null;
    img.addEventListener('pointerdown', (e) => { sx = e.clientX; });
    img.addEventListener('pointerup', (e) => { if (sx != null && Math.abs(e.clientX - sx) > 50) show(e.clientX < sx ? 1 : -1); sx = null; });
    return h('div', { cls: 'screen' },
      nav('같이 봐요', () => go('home'), false),
      h('div', { cls: 'scroll' }, h('div', { cls: 'inner' },
        img, name, pg,
        h('div', { cls: 'row', css: { marginTop: '18px' } },
          h('button', { cls: 'btn blue', onclick: () => show(-1) }, '◀ 이전'),
          h('button', { cls: 'btn green', onclick: () => show(1) }, '다음 ▶')),
        h('div', { cls: 'tip' }, '👨‍👩‍👧 "이 사람은 누구지? 여기서 뭐 하고 있어?"'))));
  };

  // ================================================================ 화면 회전
  let rt = null;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if (current && current.relayout) current.relayout(); }, 150);
  });
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  makeDemos();
  go('home');
})();
</script>
</body>
</html>
